aid: chroma
name: Chroma
kind: company
description: Chroma (Chroma DB) is an open-source AI-native embedding database designed
  to make it easy to build LLM applications by providing storage, retrieval, and management
  for vector embeddings, full-text search, regex search, and multi-modal retrieval
  (text, image, audio). Distributed under the Apache 2.0 license, Chroma can be self-hosted
  (single-node Python or distributed Rust-based deployment) or consumed via Chroma
  Cloud, a managed serverless vector database service offering usage-based pricing.
  Chroma is the open-source data infrastructure for AI agents and RAG (Retrieval-Augmented
  Generation) applications, with first-party SDKs for Python and JavaScript/TypeScript
  and integrations with leading embedding providers (OpenAI, Cohere, Hugging Face,
  sentence-transformers).
