apis:
- aid: chroma:python-client
  name: Chroma Python Client
  description: >-
    The Chroma Python Client is a first-party SDK for interacting with both self-hosted Chroma servers
    and Chroma Cloud. It provides a simple, developer-friendly interface with a core API of just four
    functions for managing collections, adding documents, and querying embeddings. The client handles
    automatic tokenization, embedding, and indexing of documents, making it straightforward to build AI
    applications that require vector similarity search.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.trychroma.com/reference/python/client
  tags:
  - Embeddings
  - Python
  - SDK
  - Vector Database
  properties:
  - type: Documentation
    url: https://docs.trychroma.com/reference/python/client
  - type: SourceCode
    url: https://github.com/chroma-core/chroma
- aid: chroma:javascript-client
  name: Chroma JavaScript Client
  description: >-
    The Chroma JavaScript and TypeScript Client is a first-party SDK for interacting with Chroma from
    JavaScript or TypeScript applications. The v3 rewrite focused on reducing bundle size and improving
    developer experience, making it well-suited for deployment on serverless platforms like Vercel. It
    supports both self-hosted Chroma instances and Chroma Cloud via the CloudClient class, providing collection
    management, document ingestion, and vector similarity search capabilities.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.trychroma.com/reference/js/client
  tags:
  - Embeddings
