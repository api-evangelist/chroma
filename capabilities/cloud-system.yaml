naftiko: 1.0.0-alpha2
info:
  label: Chroma Cloud API — System
  description: 'Chroma Cloud API — System. 2 operations. Lead operation: Check server heartbeat. Self-contained Naftiko capability
    covering one Chroma business surface.'
  tags:
  - Chroma
  - System
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CHROMA_API_KEY: CHROMA_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloud-system
    baseUri: https://api.trychroma.com
    description: Chroma Cloud API — System business capability. Self-contained, no shared references.
    resources:
    - name: api-v2-heartbeat
      path: /api/v2/heartbeat
      operations:
      - name: heartbeat
        method: GET
        description: Check server heartbeat
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-v2-version
      path: /api/v2/version
      operations:
      - name: getversion
        method: GET
        description: Get server version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.CHROMA_API_KEY}}'
  exposes:
  - type: rest
    namespace: cloud-system-rest
    port: 8080
    description: REST adapter for Chroma Cloud API — System. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v2/heartbeat
      name: api-v2-heartbeat
      description: REST surface for api-v2-heartbeat.
      operations:
      - method: GET
        name: heartbeat
        description: Check server heartbeat
        call: cloud-system.heartbeat
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v2/version
      name: api-v2-version
      description: REST surface for api-v2-version.
      operations:
      - method: GET
        name: getversion
        description: Get server version
        call: cloud-system.getversion
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cloud-system-mcp
    port: 9090
    transport: http
    description: MCP adapter for Chroma Cloud API — System. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: check-server-heartbeat
      description: Check server heartbeat
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-system.heartbeat
      outputParameters:
      - type: object
        mapping: $.
    - name: get-server-version
      description: Get server version
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-system.getversion
      outputParameters:
      - type: object
        mapping: $.
