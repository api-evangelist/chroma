naftiko: 1.0.0-alpha2
info:
  label: Chroma Server API — Databases
  description: 'Chroma Server API — Databases. 4 operations. Lead operation: List databases. Self-contained Naftiko capability
    covering one Chroma business surface.'
  tags:
  - Chroma
  - Databases
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CHROMA_API_KEY: CHROMA_API_KEY
capability:
  consumes:
  - type: http
    namespace: server-databases
    baseUri: http://localhost:8000
    description: Chroma Server API — Databases business capability. Self-contained, no shared references.
    resources:
    - name: api-v2-tenants-tenantName-databases
      path: /api/v2/tenants/{tenantName}/databases
      operations:
      - name: listdatabases
        method: GET
        description: List databases
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createdatabase
        method: POST
        description: Create a database
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v2-tenants-tenantName-databases-databaseName
      path: /api/v2/tenants/{tenantName}/databases/{databaseName}
      operations:
      - name: getdatabase
        method: GET
        description: Get a database
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletedatabase
        method: DELETE
        description: Delete a database
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.CHROMA_API_KEY}}'
  exposes:
  - type: rest
    namespace: server-databases-rest
    port: 8080
    description: REST adapter for Chroma Server API — Databases. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v2/tenants/{tenantname}/databases
      name: api-v2-tenants-tenantname-databases
      description: REST surface for api-v2-tenants-tenantName-databases.
      operations:
      - method: GET
        name: listdatabases
        description: List databases
        call: server-databases.listdatabases
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createdatabase
        description: Create a database
        call: server-databases.createdatabase
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v2/tenants/{tenantname}/databases/{databasename}
      name: api-v2-tenants-tenantname-databases-databasename
      description: REST surface for api-v2-tenants-tenantName-databases-databaseName.
      operations:
      - method: GET
        name: getdatabase
        description: Get a database
        call: server-databases.getdatabase
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletedatabase
        description: Delete a database
        call: server-databases.deletedatabase
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: server-databases-mcp
    port: 9090
    transport: http
    description: MCP adapter for Chroma Server API — Databases. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-databases
      description: List databases
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: server-databases.listdatabases
      outputParameters:
      - type: object
        mapping: $.
    - name: create-database
      description: Create a database
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: server-databases.createdatabase
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-database
      description: Get a database
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: server-databases.getdatabase
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-database
      description: Delete a database
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: server-databases.deletedatabase
      outputParameters:
      - type: object
        mapping: $.
