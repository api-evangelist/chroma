openapi: 3.2.0
info:
  title: chroma-frontend Collection API
  description: ''
  license:
    name: ''
  version: 1.0.0
tags:
- name: Collection
paths:
  /api/v2/collections/{crn}:
    get:
      tags:
      - Collection
      summary: Get collection by CRN
      description: Returns a collection by Chroma Resource Name.
      operationId: get_collection_by_crn
      parameters:
      - name: crn
        in: path
        description: Chroma Resource Name
        required: true
        schema:
          type: string
        example: my_tenant:my_database:my_collection
      responses:
        '200':
          description: Collection found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
      x-codeSamples:
      - label: Get collection by CRN
        lang: typescript
        source: const collection = await client.getCollectionByCrn('my_tenant:my_database:my_collection');
      - label: Get collection by CRN
        lang: python
        source: collection = client.get_collection_by_crn('my_tenant:my_database:my_collection')
      x-hidden: true
  /api/v2/tenants/{tenant}/databases/{database}/collections:
    get:
      tags:
      - Collection
      summary: List collections
      description: Lists all collections in a database.
      operationId: list_collections
      parameters:
      - name: tenant
        in: path
        description: Tenant UUID
        required: true
        schema:
          type: string
        example: 1e30d217-3d78-4f8c-b244-79381dc6a254
      - name: database
        in: path
        description: Database name
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Limit for pagination
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 10
      - name: offset
        in: query
        description: Offset for pagination
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
        example: 0
      responses:
        '200':
          description: List of collections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vec'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
      x-codeSamples:
      - label: List collections
        lang: typescript
        source: 'const collections = await client.listCollections({ limit: 10, offset: 0 });'
      - label: List collections
        lang: python
        source: collections = client.list_collections()
      - label: List collections
        lang: rust
        source: let collections = client.list_collections(10, Some(0)).await?;
    post:
      tags:
      - Collection
      summary: Create collection
      description: Creates a new collection in a database.
      operationId: create_collection
      parameters:
      - name: tenant
        in: path
        description: Tenant UUID
        required: true
        schema:
          type: string
        example: 1e30d217-3d78-4f8c-b244-79381dc6a254
      - name: database
        in: path
        description: Database name
        required: true
        schema:
          type: string
      requestBody:
        description: Collection creation payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionPayload'
            example:
              configuration: null
              get_or_create: false
              metadata:
                key: value
              name: my_collection
              schema: null
        required: true
      responses:
        '200':
          description: Collection created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
      x-codeSamples:
      - label: Create collection
        lang: typescript
        source: 'const collection = await client.createCollection({ name: ''my_collection'' });'
      - label: Create collection
        lang: python
        source: collection = client.create_collection(name='my_collection')
      - label: Create collection
        lang: rust
        source: let collection = client.get_or_create_collection("my_collection", None).await?;
  /api/v2/tenants/{tenant}/databases/{database}/collections/by-id/{collection_id}:
    get:
      tags:
      - Collection
      summary: Get collection by ID
      description: Returns a collection by its UUID within a specific tenant and database.
      operationId: get_collection_by_id
      parameters:
      - name: tenant
        in: path
        description: Tenant ID
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: Database name
        required: true
        schema:
          type: string
      - name: collection_id
        in: path
        description: Collection UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Collection found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
      x-codeSamples:
      - label: Get collection by ID
        lang: typescript
        source: 'const collection = await client.getCollectionById({ id: ''collection-uuid-here'' });'
      - label: Get collection by ID
        lang: python
        source: collection = client.get_collection_by_id(uuid.UUID('collection-uuid-here'))
  /api/v2/tenants/{tenant}/databases/{database}/collections/{collection_id}:
    get:
      tags:
      - Collection
      summary: Get collection
      description: Returns a collection by ID or name.
      operationId: get_collection
      parameters:
      - name: tenant
        in: path
        description: Tenant UUID
        required: true
        schema:
          type: string
        example: 1e30d217-3d78-4f8c-b244-79381dc6a254
      - name: database
        in: path
        description: Database name
        required: true
        schema:
          type: string
      - name: collection_id
        in: path
        description: Collection UUID
        required: true
        schema:
          type: string
        example: 1e30d217-3d78-4f8c-b244-79381dc6a254
      responses:
        '200':
          description: Collection found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
      x-codeSamples:
      - label: Get collection
        lang: typescript
        source: 'const collection = await client.getCollection({ name: ''my_collection'' });'
      - label: Get collection
        lang: python
        source: collection = client.get_collection(name='my_collection')
      - label: Get collection
        lang: rust
        source: let collection = client.get_collection("my_collection").await?;
    put:
      tags:
      - Collection
      summary: Update collection
      description: Updates an existing collection's name or metadata.
      operationId: update_collection
      parameters:
      - name: tenant
        in: path
        description: Tenant UUID
        required: true
        schema:
          type: string
        example: 1e30d217-3d78-4f8c-b244-79381dc6a254
      - name: database
        in: path
        description: Database name
        required: true
        schema:
          type: string
      - name: collection_id
        in: path
        description: Collection UUID
        required: true
        schema:
          type: string
        example: 1e30d217-3d78-4f8c-b244-79381dc6a254
      requestBody:
        description: Collection update payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionPayload'
            example:
              new_configuration: null
              new_metadata:
                key: value
              new_name: updated_collection_name
        required: true
      responses:
        '200':
          description: Collection updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCollectionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
      x-codeSamples:
      - label: Update collection
        lang: typescript
        source: 'await collection.modify({ name: ''new_name'', metadata: { key: ''value'' } });'
      - label: Update collection
        lang: python
        source: 'collection.modify(name=''new_name'', metadata={''key'': ''value''})'
      - label: Update collection
        lang: rust
        source: 'use chroma_types::Metadata;

          let mut metadata = Metadata::new();

          metadata.insert("key".to_string(), "value".into());

          collection.modify(Some("new_name"), Some(metadata)).await?;'
    delete:
      tags:
      - Collection
      summary: Delete collection
      description: Deletes a collection in a database.
      operationId: delete_collection
      parameters:
      - name: tenant
        in: path
        description: Tenant UUID
        required: true
        schema:
          type: string
        example: 1e30d217-3d78-4f8c-b244-79381dc6a254
      - name: database
        in: path
        description: Database name
        required: true
        schema:
          type: string
      - name: collection_id
        in: path
        description: Collection UUID
        required: true
        schema:
          type: string
        example: 1e30d217-3d78-4f8c-b244-79381dc6a254
      responses:
        '200':
          description: Collection deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCollectionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
      x-codeSamples:
      - label: Delete collection
        lang: typescript
        source: 'await client.deleteCollection({ name: ''my_collection'' });'
      - label: Delete collection
        lang: python
        source: client.delete_collection(name='my_collection')
      - label: Delete collection
        lang: rust
        source: client.delete_collection("my_collection").await?;
  /api/v2/tenants/{tenant}/databases/{database}/collections/{collection_id}/fork:
    post:
      tags:
      - Collection
      summary: Fork collection
      description: Creates a fork of an existing collection.
      operationId: fork_collection
      parameters:
      - name: tenant
        in: path
        description: Tenant UUID
        required: true
        schema:
          type: string
        example: 1e30d217-3d78-4f8c-b244-79381dc6a254
      - name: database
        in: path
        description: Database name
        required: true
        schema:
          type: string
      - name: collection_id
        in: path
        description: Collection UUID
        required: true
        schema:
          type: string
        example: 1e30d217-3d78-4f8c-b244-79381dc6a254
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkCollectionPayload'
        required: true
      responses:
        '200':
          description: Collection forked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
      x-codeSamples:
      - label: Fork collection
        lang: typescript
        source: 'const forked = await collection.fork({ name: ''forked_collection'' });'
      - label: Fork collection
        lang: python
        source: forked = collection.fork(new_name='forked_collection')
      - label: Fork collection
        lang: rust
        source: let forked = collection.fork("forked_collection").await?;
  /api/v2/tenants/{tenant}/databases/{database}/collections/{collection_id}/fork_count:
    get:
      tags:
      - Collection
      summary: Get fork count
      description: Returns the number of forks for a collection.
      operationId: fork_count
      parameters:
      - name: tenant
        in: path
        description: Tenant UUID
        required: true
        schema:
          type: string
        example: 1e30d217-3d78-4f8c-b244-79381dc6a254
      - name: database
        in: path
        description: Database name
        required: true
        schema:
          type: string
      - name: collection_id
        in: path
        description: Collection UUID
        required: true
        schema:
          type: string
        example: 1e30d217-3d78-4f8c-b244-79381dc6a254
      responses:
        '200':
          description: Fork count retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForkCountResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
      x-codeSamples:
      - label: Get fork count
        lang: typescript
        source: const count = await collection.forkCount();
      - label: Get fork count
        lang: python
        source: count = collection.fork_count()
  /api/v2/tenants/{tenant}/databases/{database}/collections_count:
    get:
      tags:
      - Collection
      summary: Get number of collections
      description: Returns the total number of collections in a database.
      operationId: count_collections
      parameters:
      - name: tenant
        in: path
        description: Tenant UUID
        required: true
        schema:
          type: string
        example: 1e30d217-3d78-4f8c-b244-79381dc6a254
      - name: database
        in: path
        description: Database name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Count of collections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/u32'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
      x-codeSamples:
      - label: Count collections
        lang: typescript
        source: 'const count: number = await client.countCollections();'
      - label: Count collections
        lang: python
        source: count = client.count_collections()
      - label: Count collections
        lang: rust
        source: let count = client.count_collections().await?;
components:
  schemas:
    Space:
      type: string
      enum:
      - l2
      - cosine
      - ip
    ErrorResponse:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
        message:
          type: string
    Schema:
      type: object
      description: 'Schema representation for collection index configurations


        This represents the server-side schema structure used for index management'
      required:
      - defaults
      - keys
      properties:
        cmek:
          type:
          - object
          - 'null'
          description: Customer-managed encryption key for collection data
        defaults:
          $ref: '#/components/schemas/ValueTypes'
          description: Default index configurations for each value type
        keys:
          type: object
          description: 'Key-specific index overrides

            TODO(Sanket): Needed for backwards compatibility. Should remove after deploy.'
          additionalProperties:
            $ref: '#/components/schemas/ValueTypes'
          propertyNames:
            type: string
    FtsAlgorithm:
      type: string
      description: 'Full-text search index algorithm.


        Controls which index format and query pipeline are used for

        document substring search within a collection.'
      enum:
      - trigram
      - token_bitmap
    BoolValueType:
      type: object
      description: Boolean value type index configurations
      properties:
        bool_inverted_index:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BoolInvertedIndexType'
    DeleteCollectionResponse:
      type: object
    IntInvertedIndexConfig:
      type: object
      additionalProperties: false
    UpdateCollectionConfiguration:
      type: object
      properties:
        embedding_function:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/EmbeddingFunctionConfiguration'
        hnsw:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UpdateHnswConfiguration'
        spann:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UpdateSpannConfiguration'
    HnswIndexConfig:
      type: object
      description: Configuration for HNSW vector index algorithm parameters
      properties:
        batch_size:
          type:
          - integer
          - 'null'
          minimum: 0
        ef_construction:
          type:
          - integer
          - 'null'
          minimum: 0
        ef_search:
          type:
          - integer
          - 'null'
          minimum: 0
        max_neighbors:
          type:
          - integer
          - 'null'
          minimum: 0
        num_threads:
          type:
          - integer
          - 'null'
          minimum: 0
        resize_factor:
          type:
          - number
          - 'null'
          format: double
        sync_threshold:
          type:
          - integer
          - 'null'
          minimum: 0
      additionalProperties: false
    SpannConfiguration:
      type: object
      properties:
        ef_construction:
          type:
          - integer
          - 'null'
          minimum: 0
        ef_search:
          type:
          - integer
          - 'null'
          minimum: 0
        max_neighbors:
          type:
          - integer
          - 'null'
          minimum: 0
        merge_threshold:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        reassign_neighbor_count:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        search_nprobe:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        space:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Space'
        split_threshold:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        write_nprobe:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      additionalProperties: false
    EmbeddingFunctionConfiguration:
      oneOf:
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - legacy
      - allOf:
        - $ref: '#/components/schemas/EmbeddingFunctionNewConfiguration'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - known
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - unknown
    FloatValueType:
      type: object
      description: Float value type index configurations
      properties:
        float_inverted_index:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FloatInvertedIndexType'
    CollectionConfiguration:
      type: object
      properties:
        embedding_function:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/EmbeddingFunctionConfiguration'
        hnsw:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HnswConfiguration'
        spann:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SpannConfiguration'
    FloatInvertedIndexConfig:
      type: object
      additionalProperties: false
    UpdateCollectionPayload:
      type: object
      properties:
        new_configuration:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UpdateCollectionConfiguration'
        new_metadata:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HashMap'
        new_name:
          type:
          - string
          - 'null'
    IntValueType:
      type: object
      description: Integer value type index configurations
      properties:
        int_inverted_index:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IntInvertedIndexType'
    FtsIndexType:
      type: object
      required:
      - enabled
      - config
      properties:
        config:
          $ref: '#/components/schemas/FtsIndexConfig'
        enabled:
          type: boolean
    ForkCollectionPayload:
      type: object
      required:
      - new_name
      properties:
        new_name:
          type: string
    IntInvertedIndexType:
      type: object
      required:
      - enabled
      - config
      properties:
        config:
          $ref: '#/components/schemas/IntInvertedIndexConfig'
        enabled:
          type: boolean
    CreateCollectionPayload:
      type: object
      required:
      - name
      properties:
        configuration:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CollectionConfiguration'
        get_or_create:
          type: boolean
        metadata:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HashMap'
        name:
          type: string
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Schema'
    HnswConfiguration:
      type: object
      properties:
        ef_construction:
          type:
          - integer
          - 'null'
          minimum: 0
        ef_search:
          type:
          - integer
          - 'null'
          minimum: 0
        max_neighbors:
          type:
          - integer
          - 'null'
          minimum: 0
        resize_factor:
          type:
          - number
          - 'null'
          format: double
        space:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Space'
        sync_threshold:
          type:
          - integer
          - 'null'
          minimum: 0
      additionalProperties: false
    CollectionUuid:
      type: string
      format: uuid
    SparseVectorIndexType:
      type: object
      required:
      - enabled
      - config
      properties:
        config:
          $ref: '#/components/schemas/SparseVectorIndexConfig'
        enabled:
          type: boolean
    SpannIndexConfig:
      type: object
      description: Configuration for SPANN vector index algorithm parameters
      properties:
        center_drift_threshold:
          type:
          - number
          - 'null'
          format: float
        ef_construction:
          type:
          - integer
          - 'null'
          minimum: 0
        ef_search:
          type:
          - integer
          - 'null'
          minimum: 0
        initial_lambda:
          type:
          - number
          - 'null'
          format: float
        max_neighbors:
          type:
          - integer
          - 'null'
          minimum: 0
        merge_threshold:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        nreplica_count:
