openapi: 3.2.0
info:
  title: chroma-frontend Tenant API
  description: ''
  license:
    name: ''
  version: 1.0.0
tags:
- name: Tenant
paths:
  /api/v2/tenants:
    post:
      tags:
      - Tenant
      summary: Create tenant
      description: Creates a new tenant.
      operationId: create_tenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantPayload'
        required: true
      responses:
        '200':
          description: Tenant created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTenantResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
  /api/v2/tenants/{tenant_name}:
    get:
      tags:
      - Tenant
      summary: Get tenant
      description: Returns an existing tenant by name.
      operationId: get_tenant
      parameters:
      - name: tenant_name
        in: path
        description: Tenant UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Tenant found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTenantResponse'
              example:
                name: 1e30d217-3d78-4f8c-b244-79381dc6a254
                resource_name: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
    patch:
      tags:
      - Tenant
      summary: Update tenant
      description: Updates an existing tenant by name.
      operationId: update_tenant
      parameters:
      - name: tenant_name
        in: path
        description: Tenant UUID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantPayload'
        required: true
      responses:
        '200':
          description: Tenant updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTenantResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Tenant resource name already set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    GetTenantResponse:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        resource_name:
          type:
          - string
          - 'null'
    ErrorResponse:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
        message:
          type: string
    UpdateTenantPayload:
      type: object
      required:
      - resource_name
      properties:
        resource_name:
          type: string
    UpdateTenantResponse:
      type: object
    CreateTenantResponse:
      type: object
    CreateTenantPayload:
      type: object
      required:
      - name
      properties:
        name:
          type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-chroma-token
x-provenance:
  method: harvested
  publisher: Chroma
  source: https://api.trychroma.com/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
