name: chroma-capabilities
description: >-
  Naftiko sandbox capabilities for Chroma, the open-source AI-native
  embedding database. Capabilities cover collection lifecycle, document
  ingestion, vector similarity search, metadata filtering, and full-text
  search across both self-hosted Chroma servers and Chroma Cloud.
provider: chroma
version: '1.0'
capabilities:
  - id: chroma.collections.create
    name: Create collection
    description: Create a new collection with an optional embedding function and metadata.
    operationId: createCollection
    inputs:
      - name: name
        type: string
        required: true
      - name: metadata
        type: object
        required: false
      - name: embeddingFunction
        type: string
        required: false
    outputs:
      - name: collection
        type: object
    tags: [collections]
  - id: chroma.collections.get
    name: Get collection
    description: Get a collection by ID or name.
    operationId: getCollection
    inputs:
      - name: collectionId
        type: string
        required: true
    outputs:
      - name: collection
        type: object
    tags: [collections]
  - id: chroma.collections.list
    name: List collections
    description: List collections in the current tenant/database.
    operationId: listCollections
    inputs: []
    outputs:
      - name: collections
        type: array
    tags: [collections]
  - id: chroma.collections.delete
    name: Delete collection
    description: Delete a collection and all of its records.
    operationId: deleteCollection
    inputs:
      - name: collectionId
        type: string
        required: true
    outputs: []
    tags: [collections]
  - id: chroma.records.add
    name: Add records
    description: Add documents (with embeddings or auto-embedding) to a collection.
    operationId: addRecords
    inputs:
      - name: collectionId
        type: string
        required: true
      - name: ids
        type: array
        required: true
      - name: documents
        type: array
        required: false
      - name: embeddings
        type: array
        required: false
      - name: metadatas
        type: array
        required: false
    outputs:
      - name: count
        type: integer
    tags: [records, ingest]
  - id: chroma.records.upsert
    name: Upsert records
    description: Upsert (insert or update) records by ID into a collection.
    operationId: upsertRecords
    inputs:
      - name: collectionId
        type: string
        required: true
      - name: ids
        type: array
        required: true
      - name: documents
        type: array
        required: false
      - name: embeddings
        type: array
        required: false
      - name: metadatas
        type: array
        required: false
    outputs:
      - name: count
        type: integer
    tags: [records, ingest]
  - id: chroma.records.delete
    name: Delete records
    description: Delete records from a collection by ID or metadata filter.
    operationId: deleteRecords
    inputs:
      - name: collectionId
        type: string
        required: true
      - name: ids
        type: array
        required: false
      - name: where
        type: object
        required: false
    outputs:
      - name: deleted
        type: integer
    tags: [records]
  - id: chroma.query.similarity
    name: Vector similarity query
    description: Query a collection for nearest-neighbor vectors with optional metadata filters.
    operationId: queryCollection
    inputs:
      - name: collectionId
        type: string
        required: true
      - name: queryEmbeddings
        type: array
        required: false
      - name: queryTexts
        type: array
        required: false
      - name: nResults
        type: integer
        required: false
      - name: where
        type: object
        required: false
      - name: whereDocument
        type: object
        required: false
    outputs:
      - name: results
        type: object
    tags: [query, search, vector]
  - id: chroma.query.fulltext
    name: Full-text query
    description: Run a full-text or regex query against documents in a collection.
    operationId: fulltextQuery
    inputs:
      - name: collectionId
        type: string
        required: true
      - name: text
        type: string
        required: true
      - name: regex
        type: boolean
        required: false
    outputs:
      - name: results
        type: object
    tags: [query, fulltext, search]
  - id: chroma.records.get
    name: Get records
    description: Retrieve records from a collection by IDs or filters.
    operationId: getRecords
    inputs:
      - name: collectionId
        type: string
        required: true
      - name: ids
        type: array
        required: false
      - name: where
        type: object
        required: false
      - name: limit
        type: integer
        required: false
    outputs:
      - name: records
        type: object
    tags: [records, query]
