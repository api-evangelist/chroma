description: Chroma Cloud is a hybrid plan-plus-usage product. Three plans (Starter, Team, Enterprise)
  set platform tier features (databases, team members, support, compliance), while four metered
  primitives (Write, Storage, Query, Network) drive the variable bill. Starter and Team include
  monthly credits; Team credits do not roll over. Enterprise is custom-priced and supports BYOC.
sources:
  - https://www.trychroma.com/pricing
